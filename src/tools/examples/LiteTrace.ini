; LiteTrace lightweight in-process tracer - example configuration
; Copy this file next to LiteTrace.dll (or into the target process working
; directory) and rename it to LiteTrace.ini. LiteTrace looks up the file in the
; current working directory first, then in the LiteTrace.dll folder.
;
; Once LiteTrace.dll is injected it:
;   1. reads this file by relative path,
;   2. installs the [trace] trigger_point hardware breakpoint,
;   3. waits for the trigger to fire, then records max_events steps,
;   4. optionally ends the process when the trace finishes.
;
; The tracing core is reused from VD-Trace (VDTraceStatic Session/Options); no
; Agent DLL and no IPC are involved, so LiteTrace is lighter than
; VDTraceAutoStart and has no launch/wait sections.
;
; backend supports DR / TF only. call_depth uses single / all / number.
; outside_execution_mode / anonymous_exec_execution_mode support EDGE or TF.
; module_call_depths format uses Module.dll:3:TF entries separated by commas.
; trigger_point format: Module.dll+0xRVA or Module.dll!0xRVA or 0xABSOLUTE.

[trace]
; Modules whose code should be traced (comma separated). Empty traces the main
; module of the process.
modules = GameAssembly.dll
; Trace output. Relative paths resolve against the LiteTrace.ini directory.
output_path = .\traces\LiteTrace.log
; Wait here before tracing starts. Example: start tracing when GameAssembly.dll
; reaches RVA 0x1234.
trigger_point = GameAssembly.dll+0x1234
trigger_enabled = true
probe_spec =
thread_id = 0
auto_select_thread = true
block_main_thread = false
; Step count: how many events to record before the trace stops. 0 = unlimited.
max_events = 20000
backend = DR
all_events = false
idle_escape_threshold = 32
call_depth = 4
outside_call_depth =
outside_execution_mode = EDGE
anonymous_exec_call_depth =
anonymous_exec_execution_mode = EDGE
module_call_depths =
trace_outside_modules = false
repeat_hits = false
enhanced_sampling = false
root_stop_on_return = false
async_thread_handoff = true

[lite]
; End the process with ExitProcess once the trace stops (max_events reached or
; finish_timeout_ms elapsed).
exit_process_on_finish = true
; Safety limit for how long to wait for the trace to finish. 0 = wait forever.
finish_timeout_ms = 0
; How often (ms) the bootstrap thread polls for trace completion.
poll_interval_ms = 50
