; VD-Trace autostart settings
; tool: launch game -> wait BepInEx-equivalent timing -> load Agent -> configure/start -> wait trace end
; wait.mode=disabled means helper loads Agent immediately after entering target process
; outside_execution_mode / anonymous_exec_execution_mode support EDGE or TF; module_call_depths format uses Module.dll:3:TF
; idle_escape_threshold controls first-hit hot empty-spin escape; 0 disables it
[launch]
game_path = F:\Program Files\Endfield Game\Endfield.exe
working_directory = F:\Program Files\Endfield Game
arguments = 
helper_path = .\bin\release\VDTraceAutoStart.dll
loader_timeout_ms = 60000
agent_timeout_ms = 30000
trace_start_timeout_ms = 30000
trace_finish_timeout_ms = 1800000
wait_for_trace_end = true

[wait]
mode = bepinex_il2cpp_scene_change
module_name = GameAssembly.dll
invoke_export = il2cpp_runtime_invoke
method_name_export = il2cpp_method_get_name
target_method_name = Internal_ActiveSceneChanged
module_poll_interval_ms = 50
wait_timeout_ms = 30000

[trace]
agent_path = .\bin\release\VDTraceAgent.dll
thread_id = 0
auto_select_thread = true
block_main_thread = false
modules = UnityPlayer.dll
output_path = .\traces\VDTrace.log
max_events = 0
idle_escape_threshold = 32
call_depth = 4
outside_call_depth = 
outside_execution_mode = EDGE
anonymous_exec_call_depth = 
anonymous_exec_execution_mode = EDGE
module_call_depths = 
trigger_point = GameAssembly.dll+0x3498AE0
probe_spec = 
trigger_enabled = true
trace_outside_modules = false
all_events = false
repeat_hits = false
enhanced_sampling = true
root_stop_on_return = false
async_thread_handoff = true
